name: Deploy to production

# Production is never automatic. It is triggered by hand and gated behind the
# "production" GitHub Environment, which must have required reviewers set —
# that approval gate is what makes this safe, not anything in this file.
#
# Code only. The production database is never overwritten from staging: it holds
# live leads, form submissions and user accounts that exist nowhere else.
# Deliberate schema or content changes go through deployment/migrate.sh.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production release'
        required: true
        default: ''
      skip_health_check:
        description: 'Skip post-deploy health check (not recommended)'
        type: boolean
        default: false

permissions:
  contents: read
  # Required by the approval gate, which opens an issue and waits for a comment.
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY to confirm. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: [guard, ci]
    runs-on: ubuntu-latest
    # Approval gate. Configure required reviewers on this environment.
    environment:
      name: production
      url: https://www.yesgermany.com
    steps:
      # ----------------------------------------------------------------------
      # Human approval gate.
      #
      # Native GitHub Environment "required reviewers" is the better mechanism,
      # but it needs GitHub Pro or above on a private repository. This achieves
      # the same second-pair-of-eyes check on the Free plan: it opens an issue
      # and blocks here until an approver comments.
      #
      # Weaker than the native gate in one respect — it lives in the workflow,
      # so anyone with write access could remove it — whereas the native rule
      # lives in repository settings. Once the plan supports it, delete this
      # step; `environment: production` below already declares the real gate.
      # ----------------------------------------------------------------------
      - name: Await human approval
        uses: trstringer/manual-approval@662b3ddbc7685f897992051e87e1b4b58c07dc03 # v1.9.1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.PRODUCTION_APPROVERS || 'itstealth' }}
          minimum-approvals: 1
          issue-title: "Approve production deploy: ${{ github.sha }}"
          issue-body: |
            A production deploy to **www.yesgermany.com** is waiting.

            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Requested by | @${{ github.actor }} |
            | Run | [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Before approving, confirm the change was verified on
            https://yg-staging.stealthlearn.in

            Comment **approved** to proceed, or **denied** to cancel.
          exclude-workflow-initiator-as-approver: false

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up database and current release
        id: backup
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
          REMOTE_BACKUP_DIR: ${{ secrets.REMOTE_BACKUP_DIR }}
        run: bash deployment/backup.sh production

      - name: Deploy managed paths
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
        run: bash deployment/deploy.sh production

      - name: Health check
        id: health
        if: ${{ !inputs.skip_health_check }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
        run: bash deployment/health-check.sh production https://www.yesgermany.com

      - name: Roll back on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
          BACKUP_STAMP: ${{ steps.backup.outputs.backup_stamp }}
        run: bash deployment/rollback.sh production

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Approved by | ${{ github.actor }} |"
            echo "| Backup | \`${{ steps.backup.outputs.backup_stamp }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Database was not modified. Rollback restores code only."
          } >> "$GITHUB_STEP_SUMMARY"
