name: Deploy to staging

# Staging deploys automatically on every push to main once CI passes.
# Production is a separate workflow and requires manual approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two deploys touch the same server at once.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://yg-staging.stealthlearn.in
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key. No TOFU in CI.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up before changing anything
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash deployment/backup.sh staging

      - name: Deploy managed paths
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash deployment/deploy.sh staging

      - name: Health check
        id: health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Staging is behind basic auth so the client's site copy is not
          # publicly browsable; the check needs to get past it.
          HEALTH_AUTH: ${{ secrets.HEALTH_AUTH }}
        run: bash deployment/health-check.sh staging https://yg-staging.stealthlearn.in

      - name: Roll back on failure
        if: failure() && steps.health.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash deployment/rollback.sh staging

      - name: Summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Result | ${{ job.status }} |"
            echo "| URL | https://yg-staging.stealthlearn.in |"
          } >> "$GITHUB_STEP_SUMMARY"
