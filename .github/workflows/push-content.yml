name: Push content to production

# Publishes work done on staging — posts, pages, Elementor designs, menus,
# categories, media, plugin settings and plugin activation — to the live site.
#
# Never automatic. Requires an explicit run, a typed confirmation, and a second
# person's approval, because it writes to a client's live website.
#
# This workflow REPLACES production's content tables. It depends on staging being
# the only place anyone edits content; see migrations/README.md and the guard in
# deployment/push-fast.sh.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUSH to confirm publishing staging content to the live site'
        required: true
        default: ''
      dry_run:
        description: 'Run checks only, write nothing'
        type: boolean
        default: true
      force:
        description: 'Push even if production has newer content (DESTROYS it)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: production-write
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PUSH" ]; then
            echo "::error::Type PUSH to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi
      - name: Warn if force was requested
        if: ${{ inputs.force }}
        run: |
          echo "::warning::FORCE_PUSH is set. Content created on production will be destroyed."

  push:
    name: Push content
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.yesgermany.com
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Staging is only reachable over Tailscale. Production is reached directly
      # on its public IP.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: ${{ vars.TS_TAGS || '' }}
          version: latest

      - name: Configure SSH for both hosts
        env:
          STAGING_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$PROD_SSH_KEY"    > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/prod_deploy_key
          # Both host keys pinned; no trust-on-first-use in CI.
          { printf '%s\n' "$STAGING_KNOWN_HOSTS"; printf '%s\n' "$PROD_KNOWN_HOSTS"; } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Runs before the approval gate so the approver can see the actual list of
      # pages being published, rather than approving a blank cheque. A dry run
      # writes nothing.
      - name: Preview what will publish
        id: preview
        env:
          STAGING_HOST: ${{ secrets.DEPLOY_HOST }}
          STAGING_USER: ${{ secrets.DEPLOY_USER }}
          STAGING_PORT: ${{ secrets.DEPLOY_PORT }}
          STAGING_SSH_KEY_FILE: /home/runner/.ssh/deploy_key
          PROD_SSH_KEY_FILE: /home/runner/.ssh/prod_deploy_key
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_ROOT: ${{ secrets.PROD_ROOT }}
          PROD_BACKUP_DIR: ${{ secrets.PROD_BACKUP_DIR }}
          FORCE_PUSH: ${{ inputs.force }}
        run: |
          set -o pipefail
          bash deployment/push-fast.sh --dry-run 2>&1 | tee /tmp/preview.txt
          # Strip ANSI colour so the text is readable inside a GitHub issue.
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/preview.txt > /tmp/preview.clean
          sed -n '/changed item(s) since\|no content changes since/,$p' /tmp/preview.clean \
            | grep -v 'Dry run complete' | head -70 > /tmp/manifest.txt
          [ -s /tmp/manifest.txt ] || echo "(could not read the change list from staging — check the log above)" > /tmp/manifest.txt
          {
            echo 'manifest<<PREVIEW_EOF'
            cat /tmp/manifest.txt
            echo 'PREVIEW_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo "### What this publish will carry"
            echo ''
            echo '```'
            cat /tmp/manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Await human approval
        if: ${{ !inputs.dry_run }}
        uses: trstringer/manual-approval@662b3ddbc7685f897992051e87e1b4b58c07dc03 # v1.9.1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.PRODUCTION_APPROVERS || 'itstealth' }}
          minimum-approvals: 1
          issue-title: "Approve CONTENT push to www.yesgermany.com"
          issue-body: |
            Publishing staging content to the **live site**.

            | | |
            |---|---|
            | Requested by | @${{ github.actor }} |
            | Force | `${{ inputs.force }}` |
            | Run | [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            **Staging says these items changed since the last publish:**

            ```
            ${{ steps.preview.outputs.manifest }}
            ```

            If the page you edited is **not** in that list, staging does not hold
            your change — check it in the editor and save again. Approving will
            publish the list above and nothing else.

            Production's database is backed up first. Users, comments, job
            applications and API credentials are preserved.

            Comment **approved** to publish, or **denied** to cancel.

      - name: Push content
        if: ${{ !inputs.dry_run }}
        env:
          STAGING_HOST: ${{ secrets.DEPLOY_HOST }}
          STAGING_USER: ${{ secrets.DEPLOY_USER }}
          STAGING_PORT: ${{ secrets.DEPLOY_PORT }}
          STAGING_SSH_KEY_FILE: /home/runner/.ssh/deploy_key
          PROD_SSH_KEY_FILE: /home/runner/.ssh/prod_deploy_key
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_ROOT: ${{ secrets.PROD_ROOT }}
          PROD_BACKUP_DIR: ${{ secrets.PROD_BACKUP_DIR }}
          FORCE_PUSH: ${{ inputs.force }}
        run: bash deployment/push-fast.sh

      - name: Verify the live site still works
        if: ${{ !inputs.dry_run }}
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          REMOTE_ROOT: ${{ secrets.PROD_ROOT }}
        run: bash deployment/health-check.sh production https://www.yesgermany.com

      - name: Summary
        if: always()
        run: |
          {
            echo "### Content push"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | ${{ inputs.dry_run && 'DRY RUN' || 'LIVE' }} |"
            echo "| Requested by | ${{ github.actor }} |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Users, comments, job applications and API credentials were preserved."
          } >> "$GITHUB_STEP_SUMMARY"
