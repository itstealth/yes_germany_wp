name: Diagnose network

# One-off diagnostic: measures throughput from a GitHub runner to both servers.
#
# The content push relays data between the two hosts. Run from a laptop that
# relay ran at ~4 MB/s, which left a 349 MB push exposed for minutes and dropped
# four times in one day. This measures what the same relay costs from CI, where
# the pipeline actually runs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: ${{ vars.TS_TAGS || '' }}
          version: latest

      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$PROD_SSH_KEY"    > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/prod_deploy_key
          { printf '%s\n' "$STAGING_KNOWN_HOSTS"; printf '%s\n' "$PROD_KNOWN_HOSTS"; } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Latency and stability
        env:
          STG: ${{ secrets.DEPLOY_HOST }}
          PRD: ${{ secrets.PROD_HOST }}
        run: |
          echo "### Latency" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for h in "$PRD" "$STG"; do
            echo "--- $h ---" | tee -a "$GITHUB_STEP_SUMMARY"
            ping -c 10 -q "$h" 2>/dev/null | tail -2 | tee -a "$GITHUB_STEP_SUMMARY" || echo "  ping blocked"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload throughput to production
        env:
          PRD: ${{ secrets.PROD_HOST }}
          PRD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          dd if=/dev/zero bs=1M count=200 2>/dev/null \
            | ssh -i ~/.ssh/prod_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "${PRD_USER}@${PRD}" 'cat > /dev/null'
          end=$(date +%s); d=$(( end - start )); [ "$d" -eq 0 ] && d=1
          echo "runner -> production: 200 MB in ${d}s = $(( 200 / d )) MB/s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload throughput to staging
        env:
          STG: ${{ secrets.DEPLOY_HOST }}
          STG_USER: ${{ secrets.DEPLOY_USER }}
          STG_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          dd if=/dev/zero bs=1M count=200 2>/dev/null \
            | ssh -i ~/.ssh/deploy_key -p "${STG_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "${STG_USER}@${STG}" 'cat > /dev/null'
          end=$(date +%s); d=$(( end - start )); [ "$d" -eq 0 ] && d=1
          echo "runner -> staging (Tailscale): 200 MB in ${d}s = $(( 200 / d )) MB/s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Server-to-server relay, as the push actually does it
        env:
          STG: ${{ secrets.DEPLOY_HOST }}
          STG_USER: ${{ secrets.DEPLOY_USER }}
          STG_PORT: ${{ secrets.DEPLOY_PORT }}
          PRD: ${{ secrets.PROD_HOST }}
          PRD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          ssh -n -i ~/.ssh/deploy_key -p "${STG_PORT}" -o BatchMode=yes "${STG_USER}@${STG}" \
              'dd if=/dev/zero bs=1M count=200 2>/dev/null' \
            | ssh -i ~/.ssh/prod_deploy_key -o BatchMode=yes "${PRD_USER}@${PRD}" 'cat > /dev/null'
          end=$(date +%s); d=$(( end - start )); [ "$d" -eq 0 ] && d=1
          echo "staging -> runner -> production: 200 MB in ${d}s = $(( 200 / d )) MB/s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "For comparison, the same relay from a laptop measured ~4 MB/s." >> "$GITHUB_STEP_SUMMARY"
