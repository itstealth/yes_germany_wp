# YES Germany — staging stack
#
# Mirrors the house pattern already used by stealthdigital_wp_* and
# kevasiya_cms_blog_* on this host: nginx:alpine + wordpress:*-fpm + mysql:8.0,
# fronted by the shared /opt/nginx-proxy container over a per-project network.
#
# PHP is pinned to 8.2 to match production. Do NOT move to 8.3/8.4 — the site
# runs Elementor Pro 3.1.1, which predates them and will fatal.
#
# Deploy target on the host: /opt/yesgermany/staging

services:
  db:
    image: mysql:8.0
    container_name: yg_staging_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Production dump contains large Elementor rows.
      - --max_allowed_packet=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yg_staging_net

  php:
    image: wordpress:php8.2-fpm
    container_name: yg_staging_php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      # Everything environment-specific lives here, never in Git.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'staging' );
        define( 'WP_HOME',    '${SITE_URL}' );
        define( 'WP_SITEURL', '${SITE_URL}' );
        define( 'YG_UPLOADS_PROXY', '${UPLOADS_PROXY}' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_MEMORY_LIMIT', '512M' );
        /* Trust the reverse proxy so is_ssl() works behind nginx-proxy. */
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_core:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - yg_staging_net

  web:
    image: nginx:alpine
    container_name: yg_staging_nginx
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - wp_core:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/uploads
    environment:
      # Consumed by the uploads fallback in default.conf.
      UPLOADS_PROXY: ${UPLOADS_PROXY}
    networks:
      - yg_staging_net

volumes:
  db_data:
  wp_core:
  nginx_cache:

networks:
  yg_staging_net:
    name: yg_staging_net
