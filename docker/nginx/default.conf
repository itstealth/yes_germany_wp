# YES Germany staging — nginx
#
# Sits behind the shared /opt/nginx-proxy container, which terminates TLS and
# forwards plain HTTP here. Do not add TLS or redirects at this layer.

# Cache proxied production uploads on disk so each file is fetched from the
# client's live server at most once, rather than on every staging pageview.
proxy_cache_path /var/cache/nginx/uploads
                 levels=1:2
                 keys_zone=uploads_cache:16m
                 max_size=2g
                 inactive=30d
                 use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # The production dump carries large Elementor payloads.
    client_max_body_size 128M;

    # Staging must never be indexed, regardless of what WordPress emits.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ------------------------------------------------------------------
    # Uploads: serve locally if present, otherwise read through to production.
    #
    # Staging holds no uploads directory (3.5 GB / 64k files live on the client
    # server). This fallback is a plain GET for a static file — there is no code
    # path by which staging can write to production.
    #
    # Anything uploaded ON staging lands in the local directory, which is
    # checked first, so new staging media never touches the live site.
    # ------------------------------------------------------------------
    location ^~ /wp-content/uploads/ {
        try_files $uri @uploads_production;
        access_log off;
        expires 30d;
    }

    location @uploads_production {
        # Docker's embedded DNS, needed to resolve the external host at runtime.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_uploads "https://www.yesgermany.com";

        proxy_pass         $upstream_uploads$request_uri;
        proxy_set_header   Host www.yesgermany.com;
        # Identify ourselves honestly in the client's access logs.
        proxy_set_header   User-Agent "yg-staging-uploads-proxy";
        proxy_ssl_server_name on;

        proxy_cache            uploads_cache;
        proxy_cache_valid      200 301 302 30d;
        proxy_cache_valid      404 1m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock       on;
        add_header X-Uploads-Cache $upstream_cache_status;

        # Never let a slow origin hang a staging pageview.
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }

    # ------------------------------------------------------------------
    # WordPress
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        # Elementor's editor is slow on large pages.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ------------------------------------------------------------------
    # Hardening
    # ------------------------------------------------------------------
    # Block PHP execution inside uploads — the single most common webshell path.
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /xmlrpc.php {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
