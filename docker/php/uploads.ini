; PHP settings for YES Germany staging.
; Chosen to match the production host so behaviour is comparable, not to be
; generous — a limit that is higher here than on production hides real bugs.

upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Production hit "Allowed memory size of 536870912 bytes exhausted" in
; class-wpdb.php, so the same ceiling is used here to reproduce that class of
; failure rather than mask it.
memory_limit = 512M

; Log to stderr so `docker compose logs php` shows fatals.
display_errors = Off
log_errors = On
error_log = /dev/stderr
