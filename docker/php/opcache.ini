; OPcache sizing for this install.
;
; Measured: the site has 13,523 PHP files (WordPress core + 48 plugins +
; 19 themes). With the PHP defaults (128 MB, 4000 files) only ~3,300 scripts
; fit and OPcache ran at a ~50% hit rate, recompiling thousands of files on
; every request — homepage TTFB was 88s versus 0.6s on production.
;
; These values must comfortably exceed the real file count, or the cache
; thrashes and the symptom returns.

opcache.enable=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.max_wasted_percentage=10
opcache.revalidate_freq=2
opcache.validate_timestamps=1
opcache.save_comments=1
opcache.jit=disable
